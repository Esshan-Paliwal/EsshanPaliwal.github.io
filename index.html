<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Multimeter Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #f8fafc; /* Light Gray/White */
            color: #1e293b; /* Dark Slate */
            font-family: 'Inter', sans-serif;
        }

        .mono-font {
            font-family: 'JetBrains Mono', monospace;
        }

        .card {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        /* Smooth color transition for the number flash */
        #ac-v {
            transition: color 0.3s ease;
        }
    </style>
</head>
<body class="min-h-screen p-6 flex flex-col">

    <div class="max-w-6xl mx-auto w-full">
        
        <header class="mb-8 flex justify-between items-center border-b border-gray-200 pb-6">
            <div>
                <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Project Dashboard</h1>
                <p class="text-gray-500 mt-1">Real-time Sensor Monitoring</p>
            </div>
            <div class="flex items-center space-x-2">
                <span class="relative flex h-3 w-3">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                </span>
                <span class="text-sm font-medium text-green-600">Live Connection</span>
            </div>
        </header>

        <div class="mb-8 bg-green-50 border-l-4 border-green-500 p-4 rounded-r-lg flex items-center justify-between">
            <div class="flex items-center">
                <svg class="w-6 h-6 text-green-500 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <div>
                    <p class="font-bold text-green-800 text-lg">SYSTEM NORMAL</p>
                    <p class="text-green-700 text-sm">Everything Under Control</p>
                </div>
            </div>
            <div class="text-right hidden md:block">
                <p class="text-xs text-green-600 font-mono">UPTIME: 00:42:15</p>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">

            <div class="card p-6 border-t-4 border-blue-500">
                <div class="flex justify-between items-start mb-4">
                    <h2 class="text-gray-500 font-semibold text-sm uppercase tracking-wider">AC Voltage</h2>
                    <span class="bg-blue-100 text-blue-800 text-xs font-bold px-2 py-1 rounded">LIVE</span>
                </div>
                <div class="flex items-baseline">
                    <span id="ac-v" class="text-6xl font-bold text-gray-900 mono-font tracking-tighter">220.00</span>
                    <span class="ml-2 text-xl text-gray-500 font-medium">V</span>
                </div>
                <div class="mt-4 h-1 w-full bg-gray-100 rounded-full overflow-hidden">
                    <div class="h-full bg-blue-500 w-3/4"></div> 
                </div>
            </div>

            <div class="card p-6 border-t-4 border-gray-300">
                <div class="flex justify-between items-start mb-4">
                    <h2 class="text-gray-400 font-semibold text-sm uppercase tracking-wider">DC Voltage</h2>
                    <span class="bg-gray-100 text-gray-500 text-xs font-bold px-2 py-1 rounded">IDLE</span>
                </div>
                <div class="flex items-baseline opacity-50">
                    <span id="dc-v" class="text-6xl font-bold text-gray-400 mono-font tracking-tighter">0.00</span>
                    <span class="ml-2 text-xl text-gray-400 font-medium">V</span>
                </div>
                <div class="mt-4 h-1 w-full bg-gray-100 rounded-full"></div>
            </div>

            <div class="card p-6 border-t-4 border-gray-300">
                <div class="flex justify-between items-start mb-4">
                    <h2 class="text-gray-400 font-semibold text-sm uppercase tracking-wider">AC Current</h2>
                    <span class="bg-gray-100 text-gray-500 text-xs font-bold px-2 py-1 rounded">IDLE</span>
                </div>
                <div class="flex items-baseline opacity-50">
                    <span id="ac-a" class="text-6xl font-bold text-gray-400 mono-font tracking-tighter">0.00</span>
                    <span class="ml-2 text-xl text-gray-400 font-medium">A</span>
                </div>
                <div class="mt-4 h-1 w-full bg-gray-100 rounded-full"></div>
            </div>

            <div class="card p-6 border-t-4 border-gray-300">
                <div class="flex justify-between items-start mb-4">
                    <h2 class="text-gray-400 font-semibold text-sm uppercase tracking-wider">DC Current</h2>
                    <span class="bg-gray-100 text-gray-500 text-xs font-bold px-2 py-1 rounded">IDLE</span>
                </div>
                <div class="flex items-baseline opacity-50">
                    <span id="dc-a" class="text-6xl font-bold text-gray-400 mono-font tracking-tighter">0.00</span>
                    <span class="ml-2 text-xl text-gray-400 font-medium">A</span>
                </div>
                <div class="mt-4 h-1 w-full bg-gray-100 rounded-full"></div>
            </div>

        </div>

        <div class="bg-white rounded-lg shadow p-4">
            <p class="text-xs font-bold text-gray-400 uppercase mb-2">System Log</p>
            <div id="log-area" class="font-mono text-xs text-gray-600 h-32 overflow-y-auto">
                </div>
        </div>

    </div>

    <script>
        // --- SIMULATION CONFIGURATION ---
        const UPDATE_INTERVAL = 2000; // 2 Seconds
        const TARGET_AC_V = 220.0;
        
        function updateDashboard() {
            // 1. Generate AC Voltage (Broader range: 218V to 222V)
            // This makes the movement very obvious
            const noise = (Math.random() * 4) - 2; 
            const acVal = (TARGET_AC_V + noise).toFixed(2);

            // 2. Update the DOM
            const acElement = document.getElementById('ac-v');
            if(acElement) {
                acElement.innerText = acVal;
                
                // Visual Flash Effect (Blue Flash)
                acElement.style.color = "#2563eb"; 
                setTimeout(() => {
                    acElement.style.color = "#111827"; // Back to dark gray
                }, 300);
            }
            
            // 3. Keep others at Zero
            document.getElementById('dc-v').innerText = "0.00";
            document.getElementById('ac-a').innerText = "0.00";
            document.getElementById('dc-a').innerText = "0.00";

            // 4. Add to Log
            const time = new Date().toLocaleTimeString();
            const logArea = document.getElementById('log-area');
            if(logArea) {
                const logLine = `[${time}] UPDATE: AC_VOLTAGE=${acVal}V | STATUS: OK`;
                logArea.innerHTML = `<div class="border-b border-gray-100 py-1">${logLine}</div>` + logArea.innerHTML;
            }
        }

        // --- Force Start ---
        document.addEventListener('DOMContentLoaded', () => {
            console.log("Dashboard Simulation Started...");
            
            // Run once immediately
            updateDashboard();
            
            // Then run continuously
            setInterval(updateDashboard, UPDATE_INTERVAL);
        });
    </script>
</body>
</html>
