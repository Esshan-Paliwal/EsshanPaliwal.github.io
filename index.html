<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Multimeter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-dark: #050505; --panel-bg: #111111; --neon-blue: #00f3ff; --neon-green: #00ff41; --neon-red: #ff003c; --neon-yellow: #ffee00; }
        body { background-color: var(--bg-dark); color: #e0e0e0; font-family: 'Roboto Mono', monospace; }
        h1, h2, .digital-font { font-family: 'Orbitron', sans-serif; letter-spacing: 2px; }
        .glow-text-blue { text-shadow: 0 0 10px var(--neon-blue); }
        .glow-text-green { text-shadow: 0 0 10px var(--neon-green); }
        .glow-text-red { text-shadow: 0 0 10px var(--neon-red); }
        .cyber-card { background-color: var(--panel-bg); border: 1px solid #333; box-shadow: 0 0 15px rgba(0, 0, 0, 0.8); position: relative; overflow: hidden; }
        .cyber-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--neon-blue), transparent); }
        @keyframes flash-red { 0%, 100% { background-color: var(--panel-bg); } 50% { background-color: #330000; box-shadow: 0 0 30px red; } }
        .alarm-active { animation: flash-red 1s infinite; border-color: var(--neon-red); }
        .btn-cyber { transition: all 0.2s; text-transform: uppercase; font-family: 'Orbitron', sans-serif; letter-spacing: 1px; }
        .btn-cyber:active { transform: scale(0.95); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-6">
    <div class="max-w-7xl mx-auto">
        <header class="mb-8 flex flex-col md:flex-row justify-between items-center border-b border-gray-800 pb-4">
            <div><h1 class="text-3xl md:text-5xl font-bold text-white glow-text-blue">SYSTEM MONITOR</h1><p class="text-gray-500 mt-2">CONNECTED VIA EMQX BROKER</p></div>
            <div class="mt-4 md:mt-0 text-right"><div id="connection-badge" class="inline-block px-4 py-2 bg-gray-900 border border-red-500 text-red-500 rounded font-bold digital-font">DISCONNECTED</div></div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="cyber-card p-6 rounded-lg">
                <h2 class="text-xl text-cyan-400 border-b border-gray-800 pb-2 mb-4">DC CIRCUIT</h2>
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div class="text-center"><p class="text-gray-500 text-xs">VOLTAGE</p><div class="text-4xl font-bold text-cyan-300 digital-font my-2"><span id="dc-v">0.00</span><span class="text-lg">V</span></div><p class="text-xs text-gray-600">PEAK: <span id="peak-dc-v" class="text-cyan-600">0.00</span></p></div>
                    <div class="text-center"><p class="text-gray-500 text-xs">CURRENT</p><div class="text-4xl font-bold text-cyan-300 digital-font my-2"><span id="dc-a">0.00</span><span class="text-lg">A</span></div><p class="text-xs text-gray-600">PEAK: <span id="peak-dc-a" class="text-cyan-600">0.00</span></p></div>
                </div>
                <div class="h-40"><canvas id="dcChart"></canvas></div>
            </div>

            <div class="cyber-card p-6 rounded-lg">
                <h2 class="text-xl text-yellow-400 border-b border-gray-800 pb-2 mb-4">AC CIRCUIT</h2>
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div class="text-center"><p class="text-gray-500 text-xs">VOLTAGE</p><div class="text-4xl font-bold text-yellow-300 digital-font my-2"><span id="ac-v">0.00</span><span class="text-lg">V</span></div><p class="text-xs text-gray-600">PEAK: <span id="peak-ac-v" class="text-yellow-600">0.00</span></p></div>
                    <div class="text-center"><p class="text-gray-500 text-xs">CURRENT</p><div class="text-4xl font-bold text-yellow-300 digital-font my-2"><span id="ac-a">0.00</span><span class="text-lg">A</span></div><p class="text-xs text-gray-600">PEAK: <span id="peak-ac-a" class="text-yellow-600">0.00</span></p></div>
                </div>
                <div class="h-40"><canvas id="acChart"></canvas></div>
            </div>

            <div class="space-y-6">
                <div id="status-card" class="cyber-card p-6 rounded-lg text-center flex flex-col justify-center h-48">
                    <p class="text-gray-400 text-sm mb-2">SYSTEM STATUS</p>
                    <div id="status-text" class="text-4xl font-bold text-green-500 digital-font glow-text-green">NORMAL</div>
                    <p id="status-msg" class="text-gray-500 mt-2 text-sm h-5">--</p>
                </div>
                <div class="cyber-card p-6 rounded-lg">
                    <h2 class="text-xl text-white border-b border-gray-800 pb-2 mb-4">COMMAND CENTER</h2>
                    <div class="space-y-3">
                        <button onclick="sendCommand('CUTOFF')" class="btn-cyber w-full bg-red-600 hover:bg-red-700 text-white font-bold py-4 rounded shadow-[0_0_15px_rgba(220,38,38,0.5)]">☢ EMERGENCY CUTOFF</button>
                        <button onclick="sendCommand('RESET')" class="btn-cyber w-full bg-green-700 hover:bg-green-800 text-white font-bold py-3 rounded border border-green-500 text-sm">↻ SYSTEM RESET</button>
                    </div>
                    <div class="mt-4 flex items-center justify-center"><input type="checkbox" id="audio-toggle" class="mr-2"><label for="audio-toggle" class="text-xs text-gray-400 cursor-pointer">ENABLE AUDIO ALERTS</label></div>
                </div>
            </div>
        </div>
        <div class="mt-6"><details><summary class="text-gray-600 text-xs cursor-pointer hover:text-cyan-400">DEBUG CONSOLE</summary><div class="bg-black border border-gray-800 p-2 mt-2 rounded h-32 overflow-y-auto font-mono text-xs text-green-500" id="message-log"></div></details></div>
    </div>

    <script>
        // ################# CONFIGURATION #################
        const brokerHost = "broker.emqx.io";  // UPDATED
        const brokerPort = 8084;              // UPDATED (WSS Port)
        const topicData = "my-multimeter/data";
        const topicCommand = "my-multimeter/command";
        // #################################################

        let client, chartDC, chartAC;
        let peaks = { dc_v: 0, dc_a: 0, ac_v: 0, ac_a: 0 };
        let audioCtx = null;

        const commonChartOptions = { responsive: true, maintainAspectRatio: false, animation: false, scales: { x: { display: false }, y: { grid: { color: '#222' }, ticks: { color: '#666', font: { family: 'Roboto Mono' } } } }, plugins: { legend: { display: false } } };

        function initCharts() {
            chartDC = new Chart(document.getElementById('dcChart').getContext('2d'), { type: 'line', data: { labels: Array(20).fill(''), datasets: [{ borderColor: '#00f3ff', borderWidth: 2, pointRadius: 0, tension: 0.4, data: Array(20).fill(0) }] }, options: commonChartOptions });
            chartAC = new Chart(document.getElementById('acChart').getContext('2d'), { type: 'line', data: { labels: Array(20).fill(''), datasets: [{ borderColor: '#ffee00', borderWidth: 2, pointRadius: 0, tension: 0.4, data: Array(20).fill(0) }] }, options: commonChartOptions });
        }

        function playAlarm() {
            if (!document.getElementById('audio-toggle').checked) return;
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.type = 'sawtooth'; o.frequency.setValueAtTime(800, audioCtx.currentTime); o.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 0.5);
            g.gain.setValueAtTime(0.1, audioCtx.currentTime); g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
            o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + 0.5);
        }

        function startConnect() {
            const clientId = "cyber_" + Math.random().toString(16).substr(2, 8);
            client = new Paho.MQTT.Client(brokerHost, brokerPort, clientId);
            client.onConnectionLost = onConnectionLost;
            client.onMessageArrived = onMessageArrived;
            log("Connecting to EMQX...");
            client.connect({ onSuccess: onConnect, onFailure: onFailure, useSSL: true });
        }

        function onConnect() { log("CONNECTED TO EMQX"); updateConnectionStatus(true); client.subscribe(topicData); }
        function onFailure(e) { log("FAILED: " + e.errorMessage); updateConnectionStatus(false); }
        function onConnectionLost(r) { if (r.errorCode !== 0) { log("LOST: " + r.errorMessage); updateConnectionStatus(false); } }

        function updateConnectionStatus(c) {
            const b = document.getElementById('connection-badge');
            if (c) { b.textContent = "CONNECTED"; b.className = "inline-block px-4 py-2 bg-green-900 border border-green-500 text-green-400 rounded font-bold digital-font glow-text-green"; }
            else { b.textContent = "DISCONNECTED"; b.className = "inline-block px-4 py-2 bg-red-900 border border-red-500 text-red-500 rounded font-bold digital-font glow-text-red"; }
        }

        function sendCommand(cmd) {
            if (client && client.isConnected()) { log(`CMD: ${cmd}`); const m = new Paho.MQTT.Message(cmd); m.destinationName = topicCommand; client.send(m); }
            else alert("Disconnected");
        }

        function onMessageArrived(m) {
            try {
                const d = JSON.parse(m.payloadString);
                updateValues(d); updateCharts(d); checkStatus(d);
            } catch (e) { log("JSON Error"); }
        }

        function updateValues(d) {
            if (d.dc_v !== undefined) document.getElementById('dc-v').innerText = d.dc_v.toFixed(2);
            if (d.dc_a !== undefined) document.getElementById('dc-a').innerText = d.dc_a.toFixed(2);
            if (d.ac_v !== undefined) document.getElementById('ac-v').innerText = d.ac_v.toFixed(1);
            if (d.ac_a !== undefined) document.getElementById('ac-a').innerText = d.ac_a.toFixed(2);
            if (d.dc_v > peaks.dc_v) peaks.dc_v = d.dc_v; if (d.dc_a > peaks.dc_a) peaks.dc_a = d.dc_a;
            if (d.ac_v > peaks.ac_v) peaks.ac_v = d.ac_v; if (d.ac_a > peaks.ac_a) peaks.ac_a = d.ac_a;
            document.getElementById('peak-dc-v').innerText = peaks.dc_v.toFixed(2); document.getElementById('peak-dc-a').innerText = peaks.dc_a.toFixed(2);
            document.getElementById('peak-ac-v').innerText = peaks.ac_v.toFixed(1); document.getElementById('peak-ac-a').innerText = peaks.ac_a.toFixed(2);
        }

        function updateCharts(d) {
            chartDC.data.datasets[0].data.shift(); chartDC.data.datasets[0].data.push(d.dc_a || 0); chartDC.update();
            chartAC.data.datasets[0].data.shift(); chartAC.data.datasets[0].data.push(d.ac_v || 0); chartAC.update();
        }

        function checkStatus(d) {
            const t = document.getElementById('status-text'), m = document.getElementById('status-msg'), c = document.getElementById('status-card');
            if (d.status === 'warning') { c.classList.add('alarm-active'); t.innerText = "WARNING"; t.className = "text-4xl font-bold text-red-500 digital-font glow-text-red"; m.innerText = d.message || "FAULT"; playAlarm(); }
            else { c.classList.remove('alarm-active'); if (d.status === 'safe_mode') { t.innerText = "SAFE MODE"; t.className = "text-4xl font-bold text-orange-500 digital-font"; m.innerText = "CUTOFF ACTIVE"; } else { t.innerText = "NORMAL"; t.className = "text-4xl font-bold text-green-500 digital-font glow-text-green"; m.innerText = "OPERATIONAL"; } }
        }

        function log(m) { const l = document.getElementById('message-log'); const t = new Date().toLocaleTimeString(); l.innerHTML = `<div class="border-b border-gray-800 py-1"><span class="text-gray-500">[${t}]</span> ${m}</div>` + l.innerHTML; }

        window.onload = function() { initCharts(); startConnect(); };
    </script>
</body>
</html>
