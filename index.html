<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Multimeter (Live Cloud)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://dweet.io/client/dweet.io.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #f8fafc;
            color: #1e293b;
            font-family: 'Inter', sans-serif;
        }

        .mono-font {
            font-family: 'JetBrains Mono', monospace;
        }

        .card {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: transform 0.2s;
        }

        /* Flash animation for new data */
        @keyframes flash-update {
            0% { color: #2563eb; }
            100% { color: #1e293b; }
        }
        .data-updated {
            animation: flash-update 0.5s ease-out;
        }
    </style>
</head>
<body class="min-h-screen p-6 flex flex-col">

    <div class="max-w-6xl mx-auto w-full">
        
        <header class="mb-8 flex justify-between items-center border-b border-gray-200 pb-6">
            <div>
                <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Project Dashboard</h1>
                <p class="text-gray-500 mt-1">Live Cloud Data (API Mode)</p>
            </div>
            <div class="flex items-center space-x-2">
                <div id="connection-dot" class="h-3 w-3 rounded-full bg-red-500"></div>
                <span id="connection-text" class="text-sm font-medium text-red-600">Disconnected</span>
            </div>
        </header>

        <div id="status-banner" class="mb-8 bg-gray-100 border-l-4 border-gray-500 p-4 rounded-r-lg flex items-center justify-between transition-colors duration-300">
            <div class="flex items-center">
                <div id="status-icon">
                    <svg class="w-6 h-6 text-gray-500 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <div>
                    <p id="status-title" class="font-bold text-gray-800 text-lg">WAITING FOR STREAM</p>
                    <p id="status-msg" class="text-gray-600 text-sm">Listening on channel: esshan-multimeter-project</p>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">

            <div class="card p-6 border-t-4 border-gray-300" id="card-ac-v">
                <div class="flex justify-between items-start mb-4">
                    <h2 class="text-gray-500 font-semibold text-sm uppercase tracking-wider">AC Voltage</h2>
                </div>
                <div class="flex items-baseline">
                    <span id="ac-v" class="text-6xl font-bold text-gray-400 mono-font tracking-tighter">0.00</span>
                    <span class="ml-2 text-xl text-gray-400 font-medium">V</span>
                </div>
            </div>

            <div class="card p-6 border-t-4 border-gray-300" id="card-dc-v">
                <div class="flex justify-between items-start mb-4">
                    <h2 class="text-gray-500 font-semibold text-sm uppercase tracking-wider">DC Voltage</h2>
                </div>
                <div class="flex items-baseline">
                    <span id="dc-v" class="text-6xl font-bold text-gray-400 mono-font tracking-tighter">0.00</span>
                    <span class="ml-2 text-xl text-gray-400 font-medium">V</span>
                </div>
            </div>

            <div class="card p-6 border-t-4 border-gray-300" id="card-ac-a">
                <div class="flex justify-between items-start mb-4">
                    <h2 class="text-gray-500 font-semibold text-sm uppercase tracking-wider">AC Current</h2>
                </div>
                <div class="flex items-baseline">
                    <span id="ac-a" class="text-6xl font-bold text-gray-400 mono-font tracking-tighter">0.00</span>
                    <span class="ml-2 text-xl text-gray-400 font-medium">A</span>
                </div>
            </div>

            <div class="card p-6 border-t-4 border-gray-300" id="card-dc-a">
                <div class="flex justify-between items-start mb-4">
                    <h2 class="text-gray-500 font-semibold text-sm uppercase tracking-wider">DC Current</h2>
                </div>
                <div class="flex items-baseline">
                    <span id="dc-a" class="text-6xl font-bold text-gray-400 mono-font tracking-tighter">0.00</span>
                    <span class="ml-2 text-xl text-gray-400 font-medium">A</span>
                </div>
            </div>

        </div>

        <div class="bg-white rounded-lg shadow p-4">
            <p class="text-xs font-bold text-gray-400 uppercase mb-2">Cloud Event Log</p>
            <div id="log-area" class="font-mono text-xs text-gray-600 h-32 overflow-y-auto"></div>
        </div>

    </div>

    <script>
        // Unique Cloud ID (Must match ESP32 code if you ever fix it)
        const THING_NAME = "esshan-multimeter-project";

        // DOM Elements
        const els = {
            ac_v: document.getElementById('ac-v'),
            dc_v: document.getElementById('dc-v'),
            ac_a: document.getElementById('ac-a'),
            dc_a: document.getElementById('dc-a'),
            statusText: document.getElementById('connection-text'),
            statusDot: document.getElementById('connection-dot'),
            log: document.getElementById('log-area')
        };

        // --- 1. START LISTENING ---
        window.onload = function() {
            log("Initializing Cloud Connection...");
            
            // Connect to Dweet.io (Free IoT Cloud)
            dweetio.listen_for(THING_NAME, function(dweet) {
                // This code runs ONLY when real data arrives
                handleData(dweet.content);
            });

            // Update UI to show we are listening
            els.statusText.innerText = "Listening for Data";
            els.statusText.className = "text-sm font-medium text-blue-600";
            els.statusDot.className = "h-3 w-3 rounded-full bg-blue-500 animate-pulse";
            log(`Connected to channel: ${THING_NAME}`);
        };

        // --- 2. HANDLE INCOMING DATA ---
        function handleData(data) {
            const time = new Date().toLocaleTimeString();
            
            // Parse values (Default to 0 if missing)
            const val_ac_v = parseFloat(data.ac_v || 0).toFixed(2);
            const val_dc_v = parseFloat(data.dc_v || 0).toFixed(2);
            const val_ac_a = parseFloat(data.ac_a || 0).toFixed(2);
            const val_dc_a = parseFloat(data.dc_a || 0).toFixed(2);

            // Update DOM with Animation
            updateField('ac-v', val_ac_v);
            updateField('dc-v', val_dc_v);
            updateField('ac-a', val_ac_a);
            updateField('dc-a', val_dc_a);

            // Update System Status based on content
            const banner = document.getElementById('status-banner');
            const title = document.getElementById('status-title');
            
            if (data.status === 'warning') {
                banner.className = "mb-8 bg-red-50 border-l-4 border-red-500 p-4 rounded-r-lg flex items-center justify-between";
                title.innerText = "WARNING ALERT";
                title.className = "font-bold text-red-800 text-lg";
            } else {
                banner.className = "mb-8 bg-green-50 border-l-4 border-green-500 p-4 rounded-r-lg flex items-center justify-between";
                title.innerText = "SYSTEM ACTIVE";
                title.className = "font-bold text-green-800 text-lg";
            }

            log(`Data Packet Received: AC_V=${val_ac_v} | DC_I=${val_dc_a}`);
        }

        // --- Helper: Update Field with Animation ---
        function updateField(id, val) {
            const el = document.getElementById(id);
            el.innerText = val;
            el.style.color = "#111827"; // active black
            el.classList.remove("data-updated");
            void el.offsetWidth; // trigger reflow
            el.classList.add("data-updated");
            
            // Highlight parent card
            const card = document.getElementById(`card-${id}`);
            if(parseFloat(val) > 0) {
                card.classList.replace('border-gray-300', 'border-blue-500');
                card.querySelector('span.text-6xl').classList.replace('text-gray-400', 'text-gray-900');
            }
        }

        function log(msg) {
            const t = new Date().toLocaleTimeString();
            els.log.innerHTML = `<div class="border-b border-gray-100 py-1">[${t}] ${msg}</div>` + els.log.innerHTML;
        }
    </script>
</body>
</html>
